services:
  mysql:
    image: mysql:8.4
    container_name: tiendaya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tiendaya}
      MYSQL_USER: ${MYSQL_USER:-tiendaya}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tiendaya}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: tiendaya-mongo
    restart: unless-stopped
    # Replica set de un solo nodo: no es para alta disponibilidad, es porque
    # las transacciones multi-documento de Mongo (ver ADR-003, historial de
    # eventos) solo funcionan sobre un replica set, ni siquiera de un nodo.
    #
    # Puerto 27018, adentro Y afuera del contenedor (no el 27017 por defecto de
    # Mongo, ni una traducción 27018:27017): si hay un MongoDB nativo de Windows
    # corriendo en 127.0.0.1:27017 (instalado por fuera de este proyecto), esa
    # dirección específica le gana a la publicación 0.0.0.0 de Docker en el
    # mismo puerto, y cualquier cliente que conecte a 127.0.0.1:27017 termina
    # hablando con el Mongo equivocado. Un mapeo tipo "27018:27017" no alcanza:
    # la config del replica set tiene que coincidir con el puerto en el que
    # mongod escucha DENTRO del contenedor (rs.reconfig lo exige — lo probamos
    # y falló con "no host... maps to this node"), así que adentro y afuera
    # tienen que ser el mismo número. Ver IA/ADR-002, notas de implementación.
    #
    # Control de acceso (IA/PLAN-ENTREGA-FINAL.md §4.2): con --auth, Mongo exige usuario y
    # contraseña. Un replica set con autenticación necesita además una llave compartida
    # (--keyFile) con la que sus miembros se identifican entre sí, aunque aquí sea uno solo.
    # La llave la genera `npm run seguridad:inicializar` (docker/mongo/keyfile, fuera de git) y
    # se COPIA a /tmp con permisos 400 y dueño mongodb: Mongo rechaza una llave con permisos
    # abiertos, y un archivo montado desde Windows siempre los tiene así. El rol y los usuarios
    # (mg_app para el servidor web, mg_admin para mantenimiento) los crea `npm run seguridad:mongo`.
    command:
      - sh
      - -c
      - >
        cp /etc/mongo-keyfile-origen /tmp/mongo-keyfile &&
        chmod 400 /tmp/mongo-keyfile &&
        chown mongodb:mongodb /tmp/mongo-keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --port 27018 --keyFile /tmp/mongo-keyfile --auth
    # Solo desde esta máquina (127.0.0.1): antes se publicaba en todas las interfaces.
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo_data:/data/db
      # create_host_path: false — si la llave no existe, Docker avisa «bind source path does not
      # exist» en vez de crear una carpeta con ese nombre.
      - type: bind
        source: ./docker/mongo/keyfile
        target: /etc/mongo-keyfile-origen
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Sin credenciales: `hello` no las pide. Está sano cuando es el primario del replica set. Si el
      # volumen es nuevo y el replica set todavía no existe, se inicia aquí (con la autenticación
      # activa Mongo lo permite desde localhost mientras no haya ningún usuario); con usuarios ya
      # creados el replica set ya existe y esta rama no se vuelve a usar.
      test: >
        mongosh --port 27018 --quiet --eval
        "const h = db.hello(); if (h.isreplicaset && !h.setName) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7
    container_name: tiendaya-redis
    restart: unless-stopped
    # Copias propias del carrito (durable en MySQL) y datos flash, con TTL.
    # Los contadores flash siguen siendo transitorios: perder Redis puede
    # reinicializar el cupo promocional aunque SQL limite el inventario real.
    # Sin persistencia especial en este entorno de desarrollo.
    #
    # Control de acceso (IA/PLAN-ENTREGA-FINAL.md §4.0 y §4.2): el usuario `default` está
    # apagado y cada módulo del backend entra con su propia cuenta, que solo tiene los
    # comandos y las llaves de ese módulo (lista blanca en backend/src/config/redisCuentas.js).
    # El archivo de ACL lo genera `npm run seguridad:inicializar` (desde backend/) y lleva
    # solo hashes de las contraseñas; sin ese archivo este contenedor no arranca.
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl"]
    volumes:
      # create_host_path: false — si el archivo no existe, Docker avisa «bind source path does not
      # exist» en vez de crear una carpeta con ese nombre (Redis fallaría con un error confuso).
      - type: bind
        source: ./docker/redis/users.acl
        target: /etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false
    #
    # Puerto del host parametrizado (default sin cambios, 6379): en Windows,
    # Hyper-V/WSL2 reserva rangos de puertos efímeros de forma dinámica (ver
    # `netsh int ipv4 show excludedportrange protocol=tcp`) y a veces 6379 cae
    # adentro — el bind falla con "forbidden by its access permissions", no
    # con "address already in use", aunque nada esté escuchando ahí de
    # verdad. Si te pasa, poné REDIS_HOST_PORT=<otro puerto> en un .env en la
    # raíz del repo (al lado de este archivo) y actualizá REDIS_URL en
    # backend/.env con el mismo puerto — el contenedor sigue hablando 6379
    # puertas adentro, esto solo cambia a qué puerto del host se publica.
    # Solo desde esta máquina (127.0.0.1): antes se publicaba en todas las interfaces.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      # Con `default` apagado, un PING sin credenciales responde NOAUTH: el servidor está vivo
      # y no hace falta ninguna contraseña en este archivo.
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5.0
    container_name: tiendaya-cassandra
    restart: unless-stopped
    # Un nodo para desarrollo: la copia analítica se puede reconstruir desde
    # MySQL. Esto no pretende ofrecer alta disponibilidad con una sola réplica.
    environment:
      CASSANDRA_CLUSTER_NAME: TiendaYaAnalytics
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    mem_limit: 2g
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
      # Cassandra no ejecuta /docker-entrypoint-initdb.d como MySQL: el cliente
      # Node aplica este CQL idempotente. El montaje permite inspeccionarlo con cqlsh.
      - ./docker/cassandra-init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local;' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  neo4j:
    image: neo4j:5
    container_name: tiendaya-neo4j
    restart: unless-stopped
    # Detección de fraude (Entrega 2, ver IA/PLAN-NEO4J-DETECCION-FRAUDE.md) —
    # copia derivada de compras/reseñas ya confirmadas en MySQL/Mongo, igual
    # criterio que Cassandra: se puede reconstruir desde las fuentes con el
    # script de backfill, no es la autoridad de nada. Con volumen (a
    # diferencia de Redis): reconstruir el grafo entero en cada reinicio de
    # desarrollo sería más fricción que beneficio mientras se prueban las
    # consultas.
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tiendaya_dev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: tiendaya-elasticsearch
    restart: unless-stopped
    # Búsqueda de productos (Entrega 3, ver IA/PLAN-ELASTICSEARCH-BUSQUEDA.md)
    # — copia derivada del catálogo de Mongo, reconstruible con
    # scripts/backfillBusqueda.js, igual criterio que Cassandra/Neo4j: no es
    # la autoridad de nada. Un nodo de desarrollo, no alta disponibilidad.
    environment:
      discovery.type: single-node
      # Sin autenticación en desarrollo, deliberado — control de acceso en un
      # componente NoSQL es un requerimiento de Entrega Final, no de esta.
      xpack.security.enabled: "false"
      # Catálogo de prueba (~10 productos): un heap chico alcanza de sobra, y
      # ya conviven Cassandra + Neo4j + Mongo + MySQL + Redis en la misma
      # máquina de desarrollo.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
  elasticsearch_data:
